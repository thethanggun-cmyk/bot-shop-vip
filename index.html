<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gun Store Mini App</title>
    <!-- SDK Telegram -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #120c18;
            color: #ffffff;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            min-height: 100vh;
        }

        /* 1. Header */
        .user-header {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: #2a2235;
            object-fit: cover;
        }

        .user-details {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .user-name {
            font-weight: 700;
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .flag {
            font-size: 10px;
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            padding: 1px 4px;
            border-radius: 4px;
        }

        .user-id {
            font-size: 11px;
            color: #8b8595;
        }

        .balance-container {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
        }

        .balance {
            color: #22c55e;
            font-weight: 700;
            font-size: 16px;
        }

        .vip-badge {
            background: rgba(14, 165, 233, 0.2);
            color: #38bdf8;
            font-size: 9px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 12px;
            border: 1px solid rgba(56, 189, 248, 0.3);
        }

        .action-btns {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .icon-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #22c55e;
        }

        /* 2. Banner Mua Key */
        .banner-key {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 18px;
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
        }

        .banner-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .key-icon {
            width: 44px;
            height: 44px;
            background: #0ea5e9;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .banner-text h3 {
            font-size: 15px;
            font-weight: 700;
        }

        .banner-text p {
            font-size: 11px;
            color: #8b8595;
            margin-top: 2px;
        }

        /* 3. Khung Danh Mục */
        .category-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 16px;
        }

        .section-title {
            color: #22c55e;
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 14px;
        }

        .grid-3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 14px;
        }

        .card-item {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 14px 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            cursor: pointer;
            position: relative;
            transition: all 0.2s ease;
        }

        .card-item.active {
            border-color: #22c55e;
            box-shadow: 0 0 10px rgba(34, 197, 94, 0.2);
        }

        .card-icon {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            margin-bottom: 8px;
        }

        .icon-android { background: rgba(34, 197, 94, 0.15); color: #22c55e; }
        .icon-ios { background: rgba(255, 255, 255, 0.1); color: #ffffff; }
        .icon-acc { background: rgba(249, 115, 22, 0.2); color: #f97316; }

        .card-name {
            font-size: 12px;
            font-weight: 700;
        }

        .card-sub {
            font-size: 10px;
            color: #8b8595;
            margin-top: 2px;
        }

        .hot-tag {
            position: absolute;
            bottom: -6px;
            background: #ef4444;
            color: white;
            font-size: 8px;
            font-weight: 800;
            padding: 1px 6px;
            border-radius: 4px;
        }

        /* 4. Khung Động Thay Thế Ở Dưới */
        .sub-services-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .other-service-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
        }

        .sub-item-card {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(34, 197, 94, 0.3);
            border-radius: 14px;
            padding: 12px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Audio ẩn */
        #bg-music { display: none; }
    </style>
</head>
<body>

    <!-- Nhạc Nền Thịnh Hành -->
    <audio id="bg-music" loop preload="auto">
        <source src="https://files.catbox.moe/97a48s.mp3" type="audio/mpeg">
    </audio>

    <!-- Header Thông Tin -->
    <div class="user-header">
        <div class="user-info">
            <img class="avatar" id="user-avatar" src="https://via.placeholder.com/44" alt="Avatar">
            <div class="user-details">
                <div class="user-name">
                    <span id="user-name">Gun</span>
                    <span class="flag">VN</span>
                </div>
                <div class="user-id">ID: <span id="user-id">8348411770</span></div>
            </div>
        </div>
        <div class="balance-container">
            <div class="balance">0đ</div>
            <div class="vip-badge">💎 VIP CUSTOMER</div>
        </div>
        <div class="action-btns">
            <div class="icon-btn" onclick="toggleMusic()" id="music-btn">🎵</div>
        </div>
    </div>

    <!-- Mua Key Tự Động -->
    <div class="banner-key">
        <div class="banner-left">
            <div class="key-icon">🔑</div>
            <div class="banner-text">
                <h3>Mua Key Tự Động</h3>
                <p>Hệ thống tự động cấp Key 24/7</p>
            </div>
        </div>
        <div style="color: #8b8595;">›</div>
    </div>

    <!-- Danh Mục Sản Phẩm -->
    <div class="category-box">
        <div class="section-title">Danh Mục Sản Phẩm</div>
        <div class="grid-3">
            <div class="card-item active" id="card-android" onclick="selectCategory('android')">
                <div class="card-icon icon-android">🤖</div>
                <div class="card-name">ANDROID</div>
                <div class="card-sub">5 mục</div>
            </div>
            <div class="card-item" id="card-ios" onclick="selectCategory('ios')">
                <div class="card-icon icon-ios">🍎</div>
                <div class="card-name">IOS</div>
                <div class="card-sub">3 mục</div>
            </div>
            <!-- Bấm vào ACC LV5 sẽ hiện 3 danh mục bên dưới -->
            <div class="card-item" id="card-acc" onclick="selectCategory('acc')">
                <div class="card-icon icon-acc">🎮</div>
                <div class="card-name">ACC LV5</div>
                <div class="hot-tag">HOT</div>
            </div>
        </div>

        <!-- Khu Vực Thay Đổi Động Khi Bấm Chuyển Danh Mục -->
        <div id="dynamic-container">
            <!-- Mặc định hiển thị Danh Mục Dịch Vụ Khác -->
            <div class="other-service-card">
                <div style="display: flex; align-items: center; gap: 12px;">
                    <div style="background: rgba(14, 165, 233, 0.2); padding: 8px; border-radius: 10px; color: #38bdf8;">📦</div>
                    <div>
                        <div style="font-size: 13px; font-weight: 700;">Danh Mục Dịch Vụ Khác</div>
                        <div style="font-size: 10px; color: #8b8595; margin-top: 2px;">Xem thêm Reg Acc, Key Vip, Tools...</div>
                    </div>
                </div>
                <div style="color: #8b8595;">»</div>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // Lấy thông tin user Telegram
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            const u = tg.initDataUnsafe.user;
            document.getElementById('user-name').innerText = u.first_name || 'Gun';
            document.getElementById('user-id').innerText = u.id || '8348411770';
            if (u.photo_url) document.getElementById('user-avatar').src = u.photo_url;
        }

        // Tự động phát nhạc khi tương tác
        const music = document.getElementById('bg-music');
        let isPlaying = false;

        document.body.addEventListener('click', () => {
            if (!isPlaying) {
                music.play().then(() => { isPlaying = true; }).catch(() => {});
            }
        }, { once: true });

        function toggleMusic() {
            if (music.paused) {
                music.play();
                document.getElementById('music-btn').style.opacity = '1';
            } else {
                music.pause();
                document.getElementById('music-btn').style.opacity = '0.4';
            }
        }

        // Xử lý sự kiện bấm chuyển Danh Mục (ACC LV5 -> Hiện 3 danh mục con)
        function selectCategory(type) {
            // Cập nhật viền xanh lá active
            document.getElementById('card-android').classList.remove('active');
            document.getElementById('card-ios').classList.remove('active');
            document.getElementById('card-acc').classList.remove('active');

            const container = document.getElementById('dynamic-container');

            if (type === 'acc') {
                document.getElementById('card-acc').classList.add('active');
                
                // Thay thế khu vực ở dưới bằng 3 danh mục con Acc FF
                container.innerHTML = `
                    <div class="sub-services-list">
                        <div class="sub-item-card" onclick="buyAcc('Acc Lv5 / 7Day')">
                            <div style="display: flex; align-items: center; gap: 10px;">
                                <span style="font-size: 18px;">🎮</span>
                                <span style="font-size: 13px; font-weight: 700;">Acc Lv5 / 7Day</span>
                            </div>
                            <span style="font-size: 11px; background: #22c55e; color: black; padding: 4px 10px; border-radius: 8px; font-weight: 700;">Mua</span>
                        </div>

                        <div class="sub-item-card" onclick="buyAcc('Acc Lv8 Uid Pass')">
                            <div style="display: flex; align-items: center; gap: 10px;">
                                <span style="font-size: 18px;">⚡</span>
                                <span style="font-size: 13px; font-weight: 700;">Acc Lv8 Uid Pass</span>
                            </div>
                            <span style="font-size: 11px; background: #22c55e; color: black; padding: 4px 10px; border-radius: 8px; font-weight: 700;">Mua</span>
                        </div>

                        <div class="sub-item-card" onclick="buyAcc('Acc Lv5 / 30Day')">
                            <div style="display: flex; align-items: center; gap: 10px;">
                                <span style="font-size: 18px;">👑</span>
                                <span style="font-size: 13px; font-weight: 700;">Acc Lv5 / 30Day</span>
                            </div>
                            <span style="font-size: 11px; background: #22c55e; color: black; padding: 4px 10px; border-radius: 8px; font-weight: 700;">Mua</span>
                        </div>
                    </div>
                `;
            } else {
                document.getElementById(`card-${type}`).classList.add('active');
                
                // Khôi phục lại khối "Danh Mục Dịch Vụ Khác" mặc định
                container.innerHTML = `
                    <div class="other-service-card">
                        <div style="display: flex; align-items: center; gap: 12px;">
                            <div style="background: rgba(14, 165, 233, 0.2); padding: 8px; border-radius: 10px; color: #38bdf8;">📦</div>
                            <div>
                                <div style="font-size: 13px; font-weight: 700;">Danh Mục Dịch Vụ Khác</div>
                                <div style="font-size: 10px; color: #8b8595; margin-top: 2px;">Xem thêm Reg Acc, Key Vip, Tools...</div>
                            </div>
                        </div>
                        <div style="color: #8b8595;">»</div>
                    </div>
                `;
            }
        }

        function buyAcc(name) {
            tg.showAlert(`Bạn chọn mua: ${name}`);
        }
    </script>
</body>
</html>
