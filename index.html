<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Shop Ken Mods Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    
    <!-- Top Header -->
    <header class="header">
      <div class="user-info">
        <div class="avatar-container">
          <img id="user-avatar" src="https://i.pravatar.cc/100" alt="Avatar">
          <span class="verify-badge"><i class="fa-solid fa-circle-check"></i></span>
        </div>
        <div class="user-details">
          <div class="name-row">
            <span id="user-name" class="username">Guest</span>
            <span class="country-tag">★ VN ▾</span>
          </div>
          <div class="user-id">ID: <span id="user-id">00000000</span></div>
        </div>
      </div>
      <div class="balance-container">
        <div class="balance-text">0đ</div>
        <div class="role-badge">CUSTOMER</div>
      </div>
      <button class="menu-btn"><i class="fa-solid fa-bars"></i></button>
    </header>

    <!-- Main Content -->
    <main class="content">

      <!-- Mua Key -->
      <section class="card buy-key-card" id="btn-buy-key">
        <div class="card-icon">
          <i class="fa-solid fa-key"></i>
        </div>
        <div class="card-text">
          <h3>Mua Key</h3>
          <p>Hệ thống tự động cấp Key qua Bot</p>
        </div>
      </section>

      <!-- Chọn Ứng Dụng -->
      <section class="card-group">
        <h4 class="section-title"><i class="fa-regular fa-circle-play"></i> Chọn ứng dụng</h4>
        <div class="app-grid">
          <div class="app-item" data-app="ANDROID">
            <div class="app-icon-box android-bg">
              <i class="fa-brands fa-android"></i>
            </div>
            <span class="app-name">ANDROID</span>
            <span class="app-count">0 mục</span>
          </div>

          <div class="app-item" data-app="IOS">
            <div class="app-icon-box ios-bg">
              <i class="fa-brands fa-apple"></i>
            </div>
            <span class="app-name">IOS</span>
            <span class="app-count">2 mục</span>
          </div>

          <div class="app-item active" data-app="GENPLAY">
            <div class="app-icon-box genplay-bg">
              <i class="fa-solid fa-diamond"></i>
            </div>
            <span class="app-name">GENPLAY</span>
            <span class="app-count">1 mục</span>
          </div>
        </div>

        <div class="sub-category-card">
          <div class="sub-icon">
            <i class="fa-solid fa-border-all"></i>
          </div>
          <div class="sub-text">
            <strong>Danh Mục Dịch Vụ</strong>
            <span>Vui lòng chọn danh mục</span>
          </div>
          <i class="fa-solid fa-angles-right arrow-icon"></i>
        </div>
      </section>

    </main>

    <!-- Toast Notification -->
    <div class="toast-notification">
      <div class="toast-icon">
        <i class="fa-solid fa-cart-shopping"></i>
      </div>
      <div class="toast-content">
        <span class="buyer-name">Bin</span>
        <span class="toast-text">vừa mua <strong class="item-highlight">ACC LV5</strong></span>
      </div>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
