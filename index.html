<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Shop Ken Mods Premium</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    
    <!-- Top Header -->
    <header class="header">
      <div class="user-info" id="btn-profile">
        <div class="avatar-container">
          <img id="user-avatar" src="https://i.pravatar.cc/100" alt="Avatar">
          <span class="verify-badge"><i class="fa-solid fa-circle-check"></i></span>
        </div>
        <div class="user-details">
          <div class="name-row">
            <span id="user-name" class="username">Khách hàng</span>
            <span class="country-tag" id="btn-country">★ VN ▾</span>
          </div>
          <div class="user-id">ID: <span id="user-id">8348411770</span></div>
        </div>
      </div>
      
      <div class="balance-container" id="btn-balance">
        <div class="balance-text"><span id="user-balance">0</span>đ</div>
        <div class="role-badge"><i class="fa-solid fa-gem"></i> VIP CUSTOMER</div>
      </div>

      <button class="menu-btn" id="btn-menu"><i class="fa-solid fa-bars-staggered"></i></button>
    </header>

    <!-- Main Content -->
    <main class="content">

      <!-- Mua Key Block -->
      <section class="card buy-key-card" id="btn-buy-key">
        <div class="card-icon glow-cyan">
          <i class="fa-solid fa-key"></i>
        </div>
        <div class="card-text">
          <h3>Mua Key Tự Động</h3>
          <p>Hệ thống tự động cấp Key instant 24/7</p>
        </div>
        <i class="fa-solid fa-chevron-right card-arrow"></i>
      </section>

      <!-- App Grid Section -->
      <section class="card-group">
        <h4 class="section-title"><i class="fa-solid fa-fire-flame-curated"></i> Danh Mục Sản Phẩm</h4>
        
        <div class="app-grid">
          <!-- Item 1: Android -->
          <div class="app-item" id="btn-app-android" data-app="ANDROID">
            <div class="app-icon-box android-bg">
              <i class="fa-brands fa-android"></i>
            </div>
            <span class="app-name">ANDROID</span>
            <span class="app-count">5 mục</span>
          </div>

          <!-- Item 2: iOS -->
          <div class="app-item" id="btn-app-ios" data-app="IOS">
            <div class="app-icon-box ios-bg">
              <i class="fa-brands fa-apple"></i>
            </div>
            <span class="app-name">IOS</span>
            <span class="app-count">3 mục</span>
          </div>

          <!-- Item 3: ACC LV5 Free Fire (Đã nâng cấp) -->
          <div class="app-item active" id="btn-app-ff" data-app="ACC_LV5">
            <div class="app-icon-box ff-bg">
              <img src="https://cdn-icons-png.flaticon.com/512/3408/3408506.png" alt="Free Fire" class="ff-icon">
            </div>
            <span class="app-name">ACC LV5</span>
            <span class="app-count badge-hot">HOT</span>
          </div>
        </div>

        <!-- Sub Category Button -->
        <div class="sub-category-card" id="btn-sub-category">
          <div class="sub-icon">
            <i class="fa-solid fa-boxes-stacked"></i>
          </div>
          <div class="sub-text">
            <strong>Danh Mục Dịch Vụ Khác</strong>
            <span>Xem thêm Reg Acc, Buff Key, Tools...</span>
          </div>
          <i class="fa-solid fa-angles-right arrow-icon"></i>
        </div>
      </section>

    </main>

    <!-- Recent Order Toast Button -->
    <div class="toast-notification" id="btn-recent-order">
      <div class="toast-icon">
        <i class="fa-solid fa-bolt"></i>
      </div>
      <div class="toast-content">
        <span class="buyer-name">Bin_FreeFire</span>
        <span class="toast-text">vừa mua <strong class="item-highlight">ACC LV5 VIP</strong></span>
      </div>
      <i class="fa-solid fa-arrow-up-right-from-square toast-arrow"></i>
    </div>

  </div>

  <!-- Glassmorphism Modal / Sheet -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal-container">
      <div class="modal-header">
        <h3 id="modal-title">Tiêu Đề</h3>
        <button class="modal-close" id="modal-close"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="modal-body" id="modal-body">
        <!-- Dynamic Content injected via JS -->
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
