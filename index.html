<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gun Store - Mini App</title>
    <!-- SDK Telegram Web App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            padding: 16px;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 22px;
            color: #38bdf8;
            margin-bottom: 6px;
        }

        .header p {
            font-size: 13px;
            color: #94a3b8;
        }

        /* Danh mục chính */
        .category-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .category-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
            font-size: 16px;
            color: #f1f5f9;
        }

        .category-header span {
            color: #f59e0b;
        }

        /* Submenu ẩn / hiện */
        .submenu {
            display: none;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px dashed #334155;
            flex-direction: column;
            gap: 10px;
        }

        .submenu.active {
            display: flex;
        }

        .sub-item {
            background: #0f172a;
            border: 1px solid #475569;
            padding: 12px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sub-item-title {
            font-size: 14px;
            color: #e2e8f0;
            font-weight: 500;
        }

        .buy-btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }

        .buy-btn:active {
            transform: scale(0.96);
        }

        /* Trình phát nhạc ẩn */
        #bg-music {
            display: none;
        }
    </style>
</head>
<body>

    <!-- Nhạc nền thịnh hành Lofi/Remix Chill -->
    <audio id="bg-music" loop preload="auto">
        <source src="https://files.catbox.moe/97a48s.mp3" type="audio/mpeg">
    </audio>

    <div class="header">
        <h1>🚀 GUN STORE FF</h1>
        <p>Hệ thống bán Acc & Key tự động 24/7</p>
    </div>

    <!-- Danh mục Acc FF -->
    <div class="category-card" onclick="toggleSubmenu()">
        <div class="category-header">
            <div>🔥 Acc FF</div>
            <span id="arrow">▼</span>
        </div>

        <!-- 3 Danh mục con -->
        <div class="submenu" id="ff-submenu">
            <div class="sub-item" onclick="event.stopPropagation(); buyProduct('Acc Lv5 / 7Day')">
                <span class="sub-item-title">🎮 Acc Lv5 / 7Day</span>
                <button class="buy-btn">Mua ngay</button>
            </div>
            <div class="sub-item" onclick="event.stopPropagation(); buyProduct('Acc Lv8 Uid Pass')">
                <span class="sub-item-title">⚡ Acc Lv8 Uid Pass</span>
                <button class="buy-btn">Mua ngay</button>
            </div>
            <div class="sub-item" onclick="event.stopPropagation(); buyProduct('Acc Lv5 / 30Day')">
                <span class="sub-item-title">👑 Acc Lv5 / 30Day</span>
                <button class="buy-btn">Mua ngay</button>
            </div>
        </div>
    </div>

    <script>
        // Khởi tạo Telegram SDK
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // Tự động phát nhạc khi người dùng nhấn bất kỳ vị trí nào trên màn hình
        const music = document.getElementById("bg-music");
        music.volume = 0.4; // Âm lượng 40%
        
        let musicStarted = false;
        document.body.addEventListener("click", () => {
            if (!musicStarted) {
                music.play().catch(e => console.log("Không thể tự phát nhạc:", e));
                musicStarted = true;
            }
        });

        // Ẩn / hiện danh mục con khi nhấn "Acc FF"
        function toggleSubmenu() {
            const submenu = document.getElementById("ff-submenu");
            const arrow = document.getElementById("arrow");
            
            if (submenu.classList.contains("active")) {
                submenu.classList.remove("active");
                arrow.innerText = "▼";
            } else {
                submenu.classList.add("active");
                arrow.innerText = "▲";
            }
        }

        // Xử lý khi bấm Mua
        function buyProduct(name) {
            tg.showAlert(`Bạn đã chọn: ${name}\nChức năng thanh toán đang được kết nối...`);
        }
    </script>
</body>
</html>
