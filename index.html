<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gun Store Mini App</title>
    <!-- SDK Telegram -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            /* Ảnh nền Game / Lofi tối màu kết hợp lớp phủ mờ */
            background: linear-gradient(rgba(18, 12, 24, 0.88), rgba(18, 12, 24, 0.95)), 
                        url('https://images.hdqwalls.com/wallpapers/free-fire-2020-4k-i5.jpg') center/cover no-repeat fixed;
            color: #ffffff;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            min-height: 100vh;
        }

        /* 1. Header */
        .user-header {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: #2a2235;
            object-fit: cover;
        }

        .user-details {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .user-name {
            font-weight: 700;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .flag {
            font-size: 10px;
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            padding: 1px 4px;
            border-radius: 4px;
        }

        .user-id {
            font-size: 11px;
            color: #8b8595;
        }

        .balance-container {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 2px;
        }

        .balance {
            color: #22c55e;
            font-weight: 700;
            font-size: 15px;
        }

        .vip-badge {
            background: rgba(14, 165, 233, 0.2);
            color: #38bdf8;
            font-size: 9px;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 10px;
            border: 1px solid rgba(56, 189, 248, 0.3);
        }

        .action-btns {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .icon-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #ffffff;
            font-size: 16px;
        }

        /* 2. Menu Slide Bên Phải */
        #drawer-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            display: none;
            z-index: 999;
        }

        #sidebar {
            position: fixed;
            top: 0; right: -280px;
            width: 250px; height: 100vh;
            background: rgba(25, 16, 36, 0.96);
            border-left: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            z-index: 1000;
            transition: right 0.3s ease;
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-shadow: -5px 0 25px rgba(0,0,0,0.6);
        }

        #sidebar.open { right: 0; }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 12px;
        }

        .sidebar-header h3 { font-size: 15px; color: #22c55e; font-weight: 700; }
        .close-btn { font-size: 18px; cursor: pointer; color: #8b8595; }

        .sidebar-menu { display: flex; flex-direction: column; gap: 10px; }

        .menu-item {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 12px 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .menu-item:active {
            background: rgba(34, 197, 94, 0.2);
            border-color: #22c55e;
        }

        .menu-icon { font-size: 18px; }

        /* 3. Banner Mua Key */
        .banner-key {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 18px;
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
        }

        .banner-left { display: flex; align-items: center; gap: 14px; }
        .key-icon {
            width: 44px; height: 44px;
            background: #0ea5e9; border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px;
        }

        .banner-text h3 { font-size: 15px; font-weight: 700; }
        .banner-text p { font-size: 11px; color: #8b8595; margin-top: 2px; }

        /* 4. Khung Danh Mục */
        .category-box {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 16px;
        }

        .section-title { color: #22c55e; font-size: 15px; font-weight: 700; margin-bottom: 14px; }

        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px; }

        .card-item {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 14px 8px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; cursor: pointer; position: relative;
            transition: all 0.2s ease;
        }

        .card-item.active { border-color: #22c55e; box-shadow: 0 0 10px rgba(34, 197, 94, 0.2); }

        .card-icon {
            width: 42px; height: 42px; border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 22px; margin-bottom: 8px;
        }

        .icon-android { background: rgba(34, 197, 94, 0.15); color: #22c55e; }
        .icon-ios { background: rgba(255, 255, 255, 0.1); color: #ffffff; }
        .icon-acc { background: rgba(249, 115, 22, 0.2); color: #f97316; }

        .card-name { font-size: 12px; font-weight: 700; }
        .card-sub { font-size: 10px; color: #8b8595; margin-top: 2px; }

        .hot-tag {
            position: absolute; bottom: -6px;
            background: #ef4444; color: white;
            font-size: 8px; font-weight: 800;
            padding: 1px 6px; border-radius: 4px;
        }

        /* 5. Khung Động Bên Dưới */
        .sub-services-list { display: flex; flex-direction: column; gap: 8px; }

        .other-service-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px; padding: 14px;
            display: flex; align-items: center; justify-content: space-between;
            cursor: pointer;
        }

        .sub-item-card {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(34, 197, 94, 0.3);
            border-radius: 14px; padding: 12px 14px;
            display: flex; align-items: center; justify-content: space-between;
            cursor: pointer; animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        #bg-music { display: none; }
    </style>
</head>
<body>

    <!-- Nhạc Nền -->
    <audio id="bg-music" loop preload="auto">
        <source src="https://files.catbox.moe/97a48s.mp3" type="audio/mpeg">
    </audio>

    <!-- Overlay & Sidebar Drawer (Danh Mục Bên Phải) -->
    <div id="drawer-overlay" onclick="toggleSidebar()"></div>
    <div id="sidebar">
        <div class="sidebar-header">
            <h3>DANH MỤC TIỆN ÍCH</h3>
            <span class="close-btn" onclick="toggleSidebar()">✕</span>
        </div>
        <div class="sidebar-menu">
            <div class="menu-item" onclick="handleMenu('Nạp Tiền')">
                <span class="menu-icon">💳</span>
                <span>Nạp Tiền</span>
            </div>
            <div class="menu-item" onclick="handleMenu('Lịch Sử Nạp')">
                <span class="menu-icon">📜</span>
                <span>Lịch Sử Nạp</span>
            </div>
            <div class="menu-item" onclick="handleMenu('Lịch Sử Mua')">
                <span class="menu-icon">🛍️</span>
                <span>Lịch Sử Mua</span>
            </div>
        </div>
    </div>

    <!-- Header Thông Tin -->
    <div class="user-header">
        <div class="user-info">
            <img class="avatar" id="user-avatar" src="https://via.placeholder.com/42" alt="Avatar">
            <div class="user-details">
                <div class="user-name">
                    <span id="user-name">Gun</span>
                    <span class="flag">VN</span>
                </div>
                <div class="user-id">ID: <span id="user-id">8348411770</span></div>
            </div>
        </div>
        <div class="balance-container">
            <div class="balance">0đ</div>
            <div class="vip-badge">💎 VIP CUSTOMER</div>
        </div>
        <div class="action-btns">
            <div class="icon-btn" onclick="toggleMusic()" id="music-btn">🎵</div>
            <!-- Nút 3 Gạch Mở Menu -->
            <div class="icon-btn" onclick="toggleSidebar()">☰</div>
        </div>
    </div>

    <!-- Banner Mua Key -->
    <div class="banner-key">
        <div class="banner-left">
            <div class="key-icon">🔑</div>
            <div class="banner-text">
                <h3>Mua Key Tự Động</h3>
                <p>Hệ thống tự động cấp Key 24/7</p>
            </div>
        </div>
        <div style="color: #8b8595;">›</div>
    </div>

    <!-- Danh Mục Sản Phẩm -->
    <div class="category-box">
        <div class="section-title">Danh Mục Sản Phẩm</div>
        <div class="grid-3">
            <div class="card-item active" id="card-android" onclick="selectCategory('android')">
                <div class="card-icon icon-android">🤖</div>
                <div class="card-name">ANDROID</div>
                <div class="card-sub">5 mục</div>
            </div>
            <div class="card-item" id="card-ios" onclick="selectCategory('ios')">
                <div class="card-icon icon-ios">🍎</div>
                <div class="card-name">IOS</div>
                <div class="card-sub">3 mục</div>
            </div>
            <div class="card-item" id="card-acc" onclick="selectCategory('acc')">
                <div class="card-icon icon-acc">🎮</div>
                <div class="card-name">ACC LV5</div>
                <div class="hot-tag">HOT</div>
            </div>
        </div>

        <!-- Khung Thay Đổi Khi Bấm Chuyển Mục -->
        <div id="dynamic-container">
            <div class="other-service-card">
                <div style="display: flex; align-items: center; gap: 12px;">
                    <div style="background: rgba(14, 165, 233, 0.2); padding: 8px; border-radius: 10px; color: #38bdf8;">📦</div>
                    <div>
                        <div style="font-size: 13px; font-weight: 700;">Danh Mục Dịch Vụ Khác</div>
                        <div style="font-size: 10px; color: #8b8595; margin-top: 2px;">Xem thêm Reg Acc, Key Vip, Tools...</div>
                    </div>
                </div>
                <div style="color: #8b8595;">»</div>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // Lấy dữ liệu Telegram
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            const u = tg.initDataUnsafe.user;
            document.getElementById('user-name').innerText = u.first_name || 'Gun';
            document.getElementById('user-id').innerText = u.id || '8348411770';
            if (u.photo_url) document.getElementById('user-avatar').src = u.photo_url;
        }

        // Bật / Tắt Menu 3 Gạch Bên Phải
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('drawer-overlay');
            if (sidebar.classList.contains('open')) {
                sidebar.classList.remove('open');
                overlay.style.display = 'none';
            } else {
                sidebar.classList.add('open');
                overlay.style.display = 'block';
            }
        }

        function handleMenu(title) {
            toggleSidebar();
            tg.showAlert(`Chức năng: ${title}`);
        }

        // Nhạc nền
        const music = document.getElementById('bg-music');
        let isPlaying = false;

        document.body.addEventListener('click', () => {
            if (!isPlaying) {
                music.play().then(() => { isPlaying = true; }).catch(() => {});
            }
        }, { once: true });

        function toggleMusic() {
            if (music.paused) {
                music.play();
                document.getElementById('music-btn').style.opacity = '1';
            } else {
                music.pause();
                document.getElementById('music-btn').style.opacity = '0.4';
            }
        }

        // Chọn Danh Mục (ACC LV5)
        function selectCategory(type) {
            document.getElementById('card-android').classList.remove('active');
            document.getElementById('card-ios').classList.remove('active');
            document.getElementById('card-acc').classList.remove('active');

            const container = document.getElementById('dynamic-container');

            if (type === 'acc') {
                document.getElementById('card-acc').classList.add('active');
                container.innerHTML = `
                    <div class="sub-services-list">
                        <div class="sub-item-card" onclick="buyAcc('Acc Lv5 / 7Day')">
                            <div style="display: flex; align-items: center; gap: 10px;">
                                <span style="font-size: 18px;">🎮</span>
                                <span style="font-size: 13px; font-weight: 700;">Acc Lv5 / 7Day</span>
                            </div>
                            <span style="font-size: 11px; background: #22c55e; color: black; padding: 4px 10px; border-radius: 8px; font-weight: 700;">Mua</span>
                        </div>

                        <div class="sub-item-card" onclick="buyAcc('Acc Lv8 Uid Pass')">
                            <div style="display: flex; align-items: center; gap: 10px;">
                                <span style="font-size: 18px;">⚡</span>
                                <span style="font-size: 13px; font-weight: 700;">Acc Lv8 Uid Pass</span>
                            </div>
                            <span style="font-size: 11px; background: #22c55e; color: black; padding: 4px 10px; border-radius: 8px; font-weight: 700;">Mua</span>
                        </div>

                        <div class="sub-item-card" onclick="buyAcc('Acc Lv5 / 30Day')">
                            <div style="display: flex; align-items: center; gap: 10px;">
                                <span style="font-size: 18px;">👑</span>
                                <span style="font-size: 13px; font-weight: 700;">Acc Lv5 / 30Day</span>
                            </div>
                            <span style="font-size: 11px; background: #22c55e; color: black; padding: 4px 10px; border-radius: 8px; font-weight: 700;">Mua</span>
                        </div>
                    </div>
                `;
            } else {
                document.getElementById(`card-${type}`).classList.add('active');
                container.innerHTML = `
                    <div class="other-service-card">
                        <div style="display: flex; align-items: center; gap: 12px;">
                            <div style="background: rgba(14, 165, 233, 0.2); padding: 8px; border-radius: 10px; color: #38bdf8;">📦</div>
                            <div>
                                <div style="font-size: 13px; font-weight: 700;">Danh Mục Dịch Vụ Khác</div>
                                <div style="font-size: 10px; color: #8b8595; margin-top: 2px;">Xem thêm Reg Acc, Key Vip, Tools...</div>
                            </div>
                        </div>
                        <div style="color: #8b8595;">»</div>
                    </div>
                `;
            }
        }

        function buyAcc(name) {
            tg.showAlert(`Bạn chọn mua: ${name}`);
        }
    </script>
</body>
</html>
